# lastshot の CI。GitHub は「リポジトリ直下の .github/workflows/」しか実行しないため、
# monorepo（eikodan）では lastshot/.github/ ではなくここに置く（lastshot/** だけを対象に path フィルタ）。
#
# 何をするか（ローカルの ./run と同じことを Linux ネイティブで一気通し）。ジョブは2本で、依存関係が
# 無いので**並列に走る**:
#   test … 単体(DB不要) → migrations → build(release)
#          → CSSゲート(Tailwind purge + semgrep) → 起動 → HTTP黒箱(test-http) → ブラウザE2E
#   lint … ./run lint（rustfmt / clippy / oxfmt / buf / shfmt+shellcheck / sqlfluff / テスト配置）
# 分けている理由: lint は DB もアプリ起動も要らず、落ちたときに知りたいことが test と別物だから。
# 直列に積むと「整形ミス1つで E2E まで待たされる／E2E が落ちると整形の結果が見えない」になる。
# DB は GitHub の postgres サービス（TCP）。dev機向け最適化（sccache/mold/-Zthreads）は
# 追加ツール無しの素ビルドにするため env で無効化（実測確認済み: RUSTFLAGS="" が .cargo/config.toml の
# target rustflags を置換、CARGO_BUILD_RUSTC_WRAPPER="" が sccache を無効化）。
#
# 注: compose分割 vs 全部入りsingle の「CI環境比較」は最終形態の計測フェーズに保留中（lastshot/docs/container-ops.md）。
#     ここではまず「ネイティブで緑になる CI」を1本通す。
name: lastshot CI

on:
  push:
    branches: [main]
    paths:
      - "lastshot/**"
      - ".github/workflows/lastshot-ci.yml"
  pull_request:
    paths:
      - "lastshot/**"
      - ".github/workflows/lastshot-ci.yml"
  # 手動で単発実行（Actions タブの "Run workflow" / gh workflow run）。
  # path フィルタに関係なく任意ブランチで CI を回せる。
  workflow_dispatch:

# 同一参照の古い実行はキャンセルして CI 時間を節約。
concurrency:
  group: lastshot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # ローカル(Apple Silicon=aarch64)・arm64 Docker とアーキ一致させるため ARM runner。
    # パブリックリポジトリなので ARM runner は無料。計測上 Rust ビルドは ~14% 速いが
    # CI 総時間は x86 とほぼ互角(大半が arch 非依存の DL/セットアップのため)。
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: lastshot
    services:
      postgres:
        # alpine(musl)で軽量・pull が ~3s 速い(実機ベンチ 13s→10s)。用途は素のSQLのみ。
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lastshot
          POSTGRES_PASSWORD: lastshot
          POSTGRES_DB: lastshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lastshot -d lastshot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # 本番/CI は TCP（compose 同一網と同じ接続作法）。
      DATABASE_URL: postgres://lastshot:lastshot@localhost:5432/lastshot
      # worktree 自動分離（PORT/PGDATABASE/BASE_URL）を CI では本流相当（スロット0）に固定。
      # ./run はこれらを ${VAR:-…} で尊重するので、チェックアウト先ディレクトリ名に依存せず
      # 3000 / lastshot で動く（postgres サービス・Start app・tests-http/browser の接続先が揃う）。
      PORT: "3000"
      PGDATABASE: lastshot
      BASE_URL: http://127.0.0.1:3000
      # dev機向け最適化を無効化（素ビルド）。
      RUSTFLAGS: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc + semgrep
        run: |
          # apt-get update(~12-17s)は省略し、ランナー同梱の index で直接 install(~8s)。
          # 稀に index が古く失敗する時だけ update→retry で自己回復(ARM実機ベンチで fast-path 確認済)。
          # migrations は Flyway(docker image)で適用するので psql クライアントは入れない。
          pkgs="protobuf-compiler"
          sudo apt-get install -y --no-install-recommends $pkgs \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends $pkgs; }
          # semgrep は uv で入れる。実機ベンチ(ARM)で pipx ~16s に対し uv は ~2s だった。
          # 速さの正体は wheel DL ではなく venv 展開で、pipx はそこが遅い(= pip cache では
          # 縮まない/実測 cold17s→warm16s)。uv(Rust製・並列・hardlink)は素で速く、キャッシュ不要。
          # semgrep の scan は --config assets/semgrep のローカルルールなので実行時 DL も無い。
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install semgrep==1.166.0

      # rustup toolchain のキャッシュは実機で逆効果(保存48s ≫ 復元4s、巨大 toolchain が
      # 10GB枠で本命 rust-cache を圧迫)のため入れない。nightly 導入(~7s)は素で実行する。
      - name: Install Rust nightly (rust-toolchain.toml に合わせる)
        # cranelift component が要るのは単体テスト（test-unit）が dev プロファイルで
        # 走るため。Cargo.toml の [profile.dev] と [profile.dev.package."*"] が
        # codegen-backend = "cranelift" を要求する（release は opt-in していないので不要だった）。
        # env で LLVM に戻す手もあるが、package."*" 側は環境変数で表現できない
        # （CARGO_PROFILE_DEV_CODEGEN_BACKEND は [profile.dev] にしか効かない）。
        # component は 2.4MB で、入れるほうが「CI はローカルの ./run と同じことをする」を保てる。
        # --component は「カンマ区切りの1引数」。空白区切りにすると2つ目がツールチェイン名として解釈される。
        run: rustup toolchain install nightly --component rust-src,rustc-codegen-cranelift-preview --profile minimal

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            lastshot
            lastshot/tests-http

      # DB もアプリ起動も要らないので、「速く落ちるもの」として migrations/build より前に置く。
      # 配置規約（spec_/unit_ のペア検査）は lint ジョブの ./run lint [7/7] が持つ ── ゲートは
      # 1か所に寄せる（両ジョブに置くと同じ失敗が2か所で赤くなり、直す場所が分かりにくくなる）。
      # 規約と命名の詳細は lastshot/docs/testing.md。
      - name: Unit tests (no DB)
        run: ./run -q test-unit

      - name: Apply migrations (Flyway / docker image = ./run と同じ)
        # postgres は service コンテナ。--network=host で runner の localhost:5432 へ繋ぐ。
        # PGDATABASE は job env で本流相当(lastshot)にピン済み。
        env:
          FLYWAY_NETWORK: host
          FLYWAY_URL: jdbc:postgresql://localhost:5432/lastshot
          FLYWAY_USER: lastshot
          FLYWAY_PASSWORD: lastshot
        run: ./run -q db-migrate

      - name: Build app (release)
        run: cargo build --release -p app

      - name: CSS gate (Tailwind purge build + semgrep)
        run: |
          ./run -q css-setup
          ./run -q css-check

      - name: Start app
        run: |
          HOST=127.0.0.1 PORT=3000 nohup ./target/release/app > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid

      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null; then
              echo "app is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "app did not start:"; cat /tmp/app.log; exit 1

      - name: HTTP black-box tests (tests-http)
        run: ./run -q test-http

      # Playwright Chromium(~120MB) と npm deps をキャッシュ。ARM 実機ベンチで browser-setup が
      # 21s→6s + restore 5s = 正味 ~10s 短縮、保存(Post)はキー命中時 0s(payload 小で rust-cache の
      # 10GB枠も圧迫しない)。本命の効果は「Chromium DL のネットワーク変動(時々30-40sに跳ねる)」を
      # 消して CI 総時間のブレを縮めること。キーは package-lock の hash 連動で playwright 更新時に自動失効。
      - name: Cache Playwright browser + npm deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            lastshot/browser/node_modules
          key: playwright-${{ runner.arch }}-${{ hashFiles('lastshot/browser/package-lock.json') }}

      - name: Browser E2E (Playwright)
        run: |
          ./run -q browser-setup
          ./run -q browser

      - name: Stop app
        if: always()
        run: kill "$(cat /tmp/app.pid)" 2>/dev/null || true

  # fmt/lint ゲート。test ジョブとは needs で繋がないので**並列に走る**。
  # DB もアプリ起動も要らないぶん test より軽い（重いのは clippy のビルドだけ）。
  lint:
    runs-on: ubuntu-24.04-arm # test と揃える（ローカル aarch64 とのアーキ一致）
    defaults:
      run:
        working-directory: lastshot
    env:
      # test ジョブと同じく dev機向け最適化を無効化（素ビルド）。
      RUSTFLAGS: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
      # ./run は worktree 名の末尾数字からポートを決め、無ければ fail-fast する。チェックアウト先の
      # ディレクトリ名（= リポジトリ名）に依存しないよう、test ジョブと同じく本流相当に固定する。
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4

      # clippy は schema をコンパイルするので build.rs の protoc が要る。
      - name: Install protoc
        run: |
          pkgs="protobuf-compiler"
          sudo apt-get install -y --no-install-recommends $pkgs \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends $pkgs; }

      # cranelift component が要る理由は build script の codegen（[profile.dev.package."*"]）。
      # 詳細は test ジョブ側の同名ステップのコメント。
      - name: Install Rust nightly (rust-toolchain.toml に合わせる)
        run: rustup toolchain install nightly --component rustfmt,clippy,rust-src,rustc-codegen-cranelift-preview --profile minimal

      # test ジョブとは別ランナー＝別 target/ なので、キャッシュも別建てにする（shared-key で明示）。
      # 混ぜると「release を焼いた test 側」と「dev 全ターゲットを焼いた lint 側」が互いを上書きし合う。
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lastshot
          shared-key: lint

      # brew 配布の4本は Linux では重い/無いので、リリース配布物を直接置く。
      # バージョンはローカル（brew）の実測値に合わせてピン留め ── CI だけ新しくなって
      # 「ローカルは緑なのに CI だけ赤」になるのを防ぐ。上げるときはローカルと一緒に上げる。
      - name: Install buf / shfmt / shellcheck / sqlfluff
        env:
          BUF_VERSION: 1.69.0
          SHFMT_VERSION: 3.13.1
          SHELLCHECK_VERSION: 0.11.0
          SQLFLUFF_VERSION: 4.2.2
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-aarch64"
          curl -fsSL -o "$bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_arm64"
          chmod +x "$bin/buf" "$bin/shfmt"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.aarch64.tar.xz" \
            | tar -xJ --strip-components=1 -C "$bin" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          # sqlfluff は Python 製。uv は semgrep と同じ理由で採用（pipx より速い ── docs/ci-performance.md §2）。
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$bin/uv" tool install "sqlfluff==${SQLFLUFF_VERSION}"
          echo "$bin" >> "$GITHUB_PATH"

      # 残りの oxfmt（node 製・lint/.lint-tools にローカル固定）を入れる。
      # バージョンは lint/setup.sh の OXFMT_VERSION が単一の真実なので、ここでは重複させず
      # setup.sh をそのまま呼ぶ。上の4本を先に入れてあるので brew 分岐には入らない。
      - name: Install oxfmt (= ./run lint-setup)
        run: ./run -q lint-setup

      - name: Lint gate (= ./run lint)
        run: ./run -q lint
