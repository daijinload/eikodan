[package]
name = "webcore"
version = "0.1.0"
edition = "2021"

# 共有コア。各featureが依存する「本当に安定したものだけ」を置く。
# ここに開発中の型を足すと全featureの再ビルドを誘発するので注意。
[dependencies]
axum = { workspace = true }
minijinja = { workspace = true }
minijinja-autoreload = { workspace = true }
# render_view が生成型を minijinja(Value) と埋め込みJSON の両方へ流すのに使う。
serde = { workspace = true }
serde_json = { workspace = true }
# AppState が共有する Postgres プールの型(PgPool)を持つため。
db = { path = "../db" }

# tests/ は別クレートとしてコンパイルされるため、[dependencies] は継承されない。
# レンダリング契約のテストが AppState を組むのに PgPool（接続は張らない connect_lazy）と、
# view として渡す serde 値に serde_json を使う。tokio は DB のためではなく、
# PgPool の構築がメンテナンス用タスクを spawn する（＝ランタイム文脈を要求する）ため。
[dev-dependencies]
db = { path = "../db" }
serde_json = { workspace = true }
tokio = { workspace = true }
